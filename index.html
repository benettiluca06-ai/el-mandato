<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Mandato</title>
<meta name="description" content="Simulador de carrera política internacional: elegí tu país, subí de cargo y mirá tu legado.">
<meta property="og:title" content="El Mandato">
<meta property="og:description" content="De concejal a la ONU. ¿Qué legado dejás?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: portal de cancillería — barra superior, columna principal + lateral; el juego es un "cable" diplomático con legajo al costado */
:root{
  --bg:#ECEFEA; --surface:#FAFBF8; --sunk:#E2E6DF; --ink:#16202E; --muted:#576274; --line:#CDD3CA;
  --accent:#1E4E8C; --accent-ink:#FFFFFF; --seal:#9E2B25;
  --good:#2E7D4F; --warn:#A86C12; --bad:#B4382F;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#0B1017; --ink:#E5E9EF; --muted:#97A2B2; --line:#283343;
  --accent:#86ADE3; --accent-ink:#0E141C; --seal:#E5867A; --good:#62C08B; --warn:#E3AE52; --bad:#E57C70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#0B1017; --ink:#E5E9EF; --muted:#97A2B2; --line:#283343;
  --accent:#86ADE3; --accent-ink:#0E141C; --seal:#E5867A; --good:#62C08B; --warn:#E3AE52; --bad:#E57C70; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0}
.brand h1{font-size:30px;text-transform:uppercase}
.brand .seal{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--seal);border:1.5px solid var(--seal);padding:1px 6px;border-radius:3px;transform:rotate(-3deg)}
.who{display:flex;align-items:center;gap:8px;font-size:13.5px}
.who img{width:28px;height:28px;border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);border:1.5px solid var(--ink);background:transparent;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Ads */
.ad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px dashed var(--line);background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--line) 35%,transparent) 10px 11px);color:var(--muted);border-radius:var(--r);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ad.leader{height:90px;margin-top:14px}
.ad.box{height:250px}
.ad.inline{height:100px}

/* Home grid */
.home{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;margin-top:22px}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);overflow:hidden}
.hero .l{padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px}
.hero h2{font-size:46px;text-transform:uppercase}
.hero p{margin:0;max-width:52ch;color:var(--muted)}
.hero .r{background:var(--ink);color:var(--bg);padding:18px;display:flex;flex-direction:column;gap:8px;font-family:var(--f-mono);font-size:12.5px}
.ladder{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ladder div{display:flex;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--bg) 22%,transparent);padding-bottom:5px}
.ladder b{font-weight:500}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.sec-h h3{font-size:22px;text-transform:uppercase}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fcard{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left}
.fcard.daily{border:1.5px solid var(--seal)}
.fcard h4{margin:0;font-family:var(--f-display);font-size:21px;font-weight:800;text-transform:uppercase;line-height:1.05}
.fcard p{margin:0;font-size:13.5px;color:var(--muted)}
.fcard .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:3px;background:var(--sunk);color:var(--ink)}
.news{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.news a{display:flex;flex-direction:column;gap:2px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.news a:nth-child(odd){padding-right:16px}
.news a:nth-child(even){padding-left:16px;border-left:1px solid var(--line)}
.news a span:first-child{font-weight:600}
.news a span:last-child{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 9px;font-size:12.5px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rank .pos{font-family:var(--f-mono);color:var(--muted)}
.rank .nm{min-width:0}
.rank .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .nm span{font-size:12px;color:var(--muted)}
.rank .pts{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.empty{padding:14px;border:1px dashed var(--line);border-radius:var(--r);font-size:13.5px;color:var(--muted)}
.howto{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.howto div{display:grid;grid-template-columns:22px 1fr;gap:6px}
.howto b{font-family:var(--f-mono);color:var(--seal)}

/* Setup */
.setup{margin-top:22px;display:flex;flex-direction:column;gap:22px;max-width:860px}
.setup h2{font-size:40px;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:8px}
.field > label,.field > .lab{font-weight:600}
input[type=text]{font:inherit;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:360px}
.grid-c{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface)}
.opt b{font-family:var(--f-display);font-size:19px;font-weight:800;text-transform:uppercase;line-height:1.1}
.opt span{font-size:12px;color:var(--muted)}
.opt .code{font-family:var(--f-mono);font-size:11px;color:var(--seal);letter-spacing:.1em}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{color:inherit;opacity:.7}

/* Game */
.game{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;margin-top:20px;align-items:start}
.legajo{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
.legajo h3{font-size:26px;text-transform:uppercase}
.cargo{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--accent);line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.stats{display:flex;flex-direction:column;gap:8px}
.stat{display:grid;grid-template-columns:96px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12.5px}
.bar{height:8px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .4s ease}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.tray{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:5px;font-size:12.5px;max-height:180px;overflow:auto}
.tray li{padding-left:10px;position:relative}
.tray li::before{content:"";position:absolute;left:-5px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.tray li:last-child::before{background:var(--accent)}
.tray .y{font-family:var(--f-mono);color:var(--muted);margin-right:6px}
.cable{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cable-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em}
.cable-b{padding:20px 18px 22px;display:flex;flex-direction:column;gap:14px}
.cable-b h2{font-size:34px;text-transform:uppercase}
.cable-b .txt{font-size:16px;max-width:62ch;margin:0}
.stamp{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--seal);border:1.5px solid var(--seal);padding:2px 8px;border-radius:3px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg)}
.choice:hover{border-color:var(--accent)}
.choice .k{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.choice small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.d{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:3px;background:var(--sunk)}
.d.up{color:var(--good)} .d.down{color:var(--bad)}
.res{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:0;font-size:15px}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg)}
.offer b{font-family:var(--f-display);font-size:20px;font-weight:800;text-transform:uppercase}
.offer span{display:block;font-size:12.5px;color:var(--muted)}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vote{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* Legacy */
.legacy{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
.lcard{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:16px}
.ltitle{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,72px);text-transform:uppercase;line-height:.95;color:var(--seal)}
.lpts{font-family:var(--f-mono);font-size:15px}
.timeline{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.timeline div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.timeline span{font-family:var(--f-mono);color:var(--muted);font-size:12.5px}
.logros{display:flex;flex-wrap:wrap;gap:6px}
.share{width:100%;min-height:150px;font-family:var(--f-mono);font-size:12.5px;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.foot{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.adwrap{display:flex;flex-direction:column;gap:4px;min-width:0}
.adwrap .adlab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.leader{margin-top:14px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--ink) 55%,transparent)}
.mbox{width:100%;max-width:400px;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px}
.mbox h3{font-size:28px;text-transform:uppercase}
.mbox p{margin:0}
.mbox form{display:flex;flex-direction:column;gap:8px}
.mbox input{font:inherit;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.mg-top{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:13px}
.mg-top b{font-size:18px}
.arena{position:relative;height:280px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.pop{position:absolute;border-radius:999px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);padding:8px 12px;font-weight:600;font-size:13.5px;white-space:nowrap;animation:pop .18s ease-out}
.pop.trap{border-color:var(--bad);color:var(--bad)}
.pop.hit{background:var(--good);border-color:var(--good);color:var(--surface)}
.pop.trap.hit{background:var(--bad);border-color:var(--bad)}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
.mg-end{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.mg-end b{font-family:var(--f-display);font-size:36px;text-transform:uppercase}
.tbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--accent)}
.q{font-weight:600;font-size:20px;line-height:1.3}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--bg))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--bg))}
.choice[disabled]{cursor:default}
.nego{display:flex;flex-direction:column;gap:12px}
.nego-v{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
/* ---- v4 ---- */
.sel{font:inherit;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:360px}
.actas{display:grid;gap:8px}
.acta{padding:12px 4px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.acta.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.acta.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.agenda{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:420px}
.ag{padding:22px 8px;border-radius:var(--r);border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;transition:background .1s,transform .1s;touch-action:manipulation}
.ag0{--c:var(--accent)} .ag1{--c:var(--seal)} .ag2{--c:var(--warn)} .ag3{--c:var(--good)}
.ag.lit,.ag.tap{background:var(--c);border-color:var(--c);color:var(--surface);transform:scale(1.03)}
.ag.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
/* ---- v3: juego ---- */
.play{max-width:720px;margin:20px auto 0;display:flex;flex-direction:column;gap:14px}
.hud{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:19px}
.me-t{display:flex;flex-direction:column;min-width:0}
.me-t b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-t span{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--accent);line-height:1.1}
.hud-meta{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hud-meta b{font-size:20px;color:var(--ink);font-weight:500}
.ladder2{display:flex;align-items:center;gap:4px}
.ladder2 i{flex:1;height:6px;border-radius:3px;background:var(--sunk);max-width:60px}
.ladder2 i.on{background:color-mix(in srgb,var(--accent) 55%,var(--sunk))}
.ladder2 i.now{background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.ladder2 span{margin-left:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.ladder2.big{justify-content:center;width:100%;max-width:420px}
.ladder2.big i{height:10px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:3px 6px;font-size:12px}
.meter .ml{color:var(--muted)}
.meter .mv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;grid-row:1;grid-column:2;display:flex;gap:4px;align-items:baseline}
.meter .mv em{font-style:normal;font-size:11px;font-weight:500;animation:pulse 1.2s ease-out}
.meter .mv em.up{color:var(--good)} .meter .mv em.down{color:var(--bad)}
.meter .bar{grid-column:1/3}
.meter .bar i{transition:width .7s cubic-bezier(.2,.8,.2,1),background .4s}
@keyframes pulse{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.dl{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cable-b h2{font-size:32px}
.choice{transition:transform .08s,border-color .15s}
.choice:active{transform:scale(.98)}
.tray2{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px}
.tray2 summary{cursor:pointer;font-weight:600;font-size:14px}
.tray2 .tray{margin-top:10px;max-height:none}
.row-a{display:flex;gap:8px;flex-wrap:wrap}
.asum{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-block:18px}
.asum-pre{font-size:15px;color:var(--muted)}
.asum-c{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,9vw,58px);line-height:.95;text-transform:uppercase;color:var(--accent);animation:rise .6s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.vs{display:flex;flex-direction:column;gap:10px}
.vs-r{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:4px 10px;align-items:center;font-size:13.5px}
.vs-r>span:first-child{grid-column:1/3}
.vs-r em{font-style:normal;color:var(--seal);font-size:12px}
.vs-b{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.vs-b i{display:block;height:100%;width:0;background:var(--muted);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.vs-b i.me-b{background:var(--accent)}
.vs-r b{font-family:var(--f-display);font-size:26px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:12.5px;padding:4px 8px;border-radius:4px;background:var(--sunk)}
.attack{border-left:4px solid var(--seal);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:6px}
.attack p{margin:0;font-size:18px;font-weight:600;line-height:1.3}
.atype{align-self:flex-start;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;color:var(--accent-ink)}
.t-dato{background:var(--accent)} .t-chicana{background:var(--warn)} .t-trampa{background:var(--seal)}
.resp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.resp .btn{padding:12px 6px;font-size:13.5px}
.resp .btn.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.resp .btn.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.seats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:360px}
.seat{aspect-ratio:1.4;border-radius:10px 10px 4px 4px;border:1.5px solid var(--line);background:var(--bg);transition:background .15s}
.seat:not([disabled]){cursor:pointer;border-color:var(--ink)}
.seat.lit{background:var(--accent);border-color:var(--accent)}
.seat.ok{background:var(--good);border-color:var(--good)}
.seat.bad{background:var(--bad);border-color:var(--bad)}
.seat.miss{border:2px dashed var(--accent)}
.fronts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.front{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:left;padding:14px;border-radius:var(--r);border:1.5px solid var(--ink);background:var(--bg);touch-action:manipulation}
.front:active{transform:scale(.97)}
.front .fl{font-weight:600}
.front .fb{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.front .fb i{display:block;height:100%}
.front.dead{opacity:.45;border-style:dashed}
.gauge{position:relative;height:46px;border-radius:var(--r);background:var(--sunk);border:1.5px solid var(--line);overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 45%,transparent);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--ink);left:0}
.gauge.ok{border-color:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 35%,transparent)}
.gauge.bad{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 35%,transparent)}
.big-btn{padding:14px 18px;font-size:16px;align-self:stretch}
@media (max-width:520px){.meters{grid-template-columns:repeat(2,minmax(0,1fr))}.cable-b h2{font-size:27px}.resp .btn{font-size:12.5px}}
@media (max-width:900px){
  .home,.legacy{grid-template-columns:minmax(0,1fr)}
  .game{grid-template-columns:minmax(0,1fr)}
  .legajo{position:static}
  .ad.box{height:100px}
  .feat{grid-template-columns:minmax(0,1fr)}
  .grid-c{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero h2{font-size:38px}
  .news{grid-template-columns:minmax(0,1fr)}
  .news a:nth-child(n){padding:10px 0;border-left:0}
  .ad.leader{height:60px}
  .brand h1{font-size:22px;white-space:nowrap}
  .brand .seal{display:none}
  .cable-b h2{font-size:28px}
  .tray{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

let rankTab="global",rankDocs=[],rankTimer=null;
async function subRanking(){clearInterval(rankTimer);await cargarRanking();rankTimer=setInterval(()=>{if($("#rankList"))cargarRanking()},60000)}
async function cargarRanking(){
  if(!SB){rankDocs=null;return paintRanking()}
  let q=SB.from("legados").select("user_id,nombre,puntos,titulo,pais,diario_puntos,diario_titulo,diario_pais");
  q=rankTab==="global"?q.order("puntos",{ascending:false}).limit(10):q.eq("diario_fecha",hoyISO()).order("diario_puntos",{ascending:false}).limit(10);
  const {data,error}=await q;rankDocs=error?[]:(data||[]);paintRanking();
}
function paintRanking(){
  const box=$("#rankList");if(!box)return;
  if(rankDocs===null){box.innerHTML='<div class="empty">El ranking se activa cuando el sitio tenga la base de datos configurada.</div>';return}
  if(!rankDocs.length){box.innerHTML='<div class="empty">'+(rankTab==="global"?"Todavía no hay legados. Ingresá, terminá una partida y estrenalo.":"Nadie jugó el desafío de hoy. Podés ser el primero.")+'</div>';return}
  const ol=document.createElement("ol");ol.className="rank";
  rankDocs.forEach((d,i)=>{
    const g=rankTab==="global",li=document.createElement("li");
    li.innerHTML='<span class="pos">'+String(i+1).padStart(2,"0")+'</span><span class="nm"><b></b><span></span></span><span class="pts"></span>';
    li.querySelector("b").textContent=d.nombre||"Jugador";
    li.querySelector(".nm span").textContent=((g?d.titulo:d.diario_titulo)||"")+" · "+(PAISES[g?d.pais:d.diario_pais]?.n||"");
    li.querySelector(".pts").textContent=Number((g?d.puntos:d.diario_puntos)||0).toLocaleString("es-AR");
    if(SESSION&&d.user_id===SESSION.user.id)li.style.fontWeight="600";
    ol.appendChild(li);
  });
  box.innerHTML="";box.appendChild(ol);
}

let NEWS=null,NEWS_AT=0;
function hace(iso){const m=Math.max(1,Math.round((Date.now()-new Date(iso))/60000));return m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`}
async function cargarNoticias(){
  const box=$("#newsList"),st=$("#newsState");if(!box)return;
  try{
    if(!NEWS||Date.now()-NEWS_AT>10*60000){
      const r=await fetch("/api/news");if(!r.ok)throw new Error(r.status);
      const j=await r.json();if(!j.items?.length)throw new Error("vacío");NEWS=j.items;NEWS_AT=Date.now();
    }
    if(!$("#newsList"))return;
    box.innerHTML="";
    NEWS.slice(0,8).forEach(n=>{const a=document.createElement("a");a.href=n.url;a.target="_blank";a.rel="noopener";a.innerHTML="<span></span><span></span>";a.children[0].textContent=n.title;a.children[1].textContent=(n.source?n.source+" · ":"")+hace(n.publishedAt);box.appendChild(a)});
    st.textContent="En vivo";
  }catch(e){
    box.innerHTML=FUENTES.map(f=>`<a href="${f[1]}" target="_blank" rel="noopener"><span>${f[0]}</span><span>Abre en otra pestaña</span></a>`).join("");
    st.textContent="Fuentes";
  }
}

/* ================== MOTOR ================== */
const KIND_TAGS={loc:["loc","prov"],leg:["leg","prov"],terr:["terr","prov"],gob:["gob"],top:["top","gob"],dip:["dip"]};
const KIND_N={loc:"Concejo",leg:"Legislativo",terr:"Ejecutivo local",gob:"Gobierno",top:"Jefatura de gobierno",dip:"Diplomacia"};
function partidoDe(){return (PARTIDOS[G.pais]||[]).find(x=>x[0]===G.partido)||PARTIDOS[G.pais][0]}
function nuevoRival(){
  const N=NOMBRES[G.pais],ps=PARTIDOS[G.pais].filter(x=>x[0]!==G.partido&&x[0]!=="IND");
  const pa=ps.length?pick(ps.filter(x=>x[2]>=2).length?ps.filter(x=>x[2]>=2):ps):PARTIDOS[G.pais][0];
  return {n:pick(N[0])+" "+pick(N[1]),pa:pa[0]};
}
function nueva(o){
  G={pais:o.pais,partido:o.partido,origen:o.origen,rasgos:o.rasgos,nombre:(o.nombre||"").trim()||nombreUsuario()||"Sin nombre",diario:!!o.diario,yaJugado:!!o.yaJugado,
     rs:o.seed??Math.floor(Math.random()*2**31),anio:2027,edad:28,turnos:0,st:{l:45,i:45,p:45,n:50,e:50,s:5},
     cargo:null,ultTier:1,aniosCargo:0,mandatoAnios:0,mandatos:0,hist:[],maxTier:0,ramas:[],kinds:[],usados:[],puntos:0,
     elecG:0,elecP:0,maxEsc:0,exTop:false,topMandatos:0,nemWins:0,fase:"evento",cola:[],ev:0,vista:"game",log:[]};
  const pa=partidoDe();G.partido=pa[0];G.ideo=pa[3];
  const pv=PROVS[G.pais].find(x=>x[0]===o.prov)||PROVS[G.pais][0];
  G.provLab=pv[0];G.prov=pv[1];G.ciudad=pv[2];G.racha=0;
  G.nemesis=nuevoRival();
  const add=ef=>{for(const k in ef)G.st[k]=clamp(G.st[k]+ef[k],0,100)};
  add(ORIGENES[G.origen].ef);add(IDEOS[G.ideo].ef);add(PESO[pa[2]].ef);
  const rs=rangos(G.pais);let start;
  if(o.modo==="escenario"){
    const e=ESCENARIOS.find(x=>x.id===o.esc);add(e.ef);G.edad=e.edad;
    const br=rs.filter(r=>r.rama===e.rama);
    start=e.ordenTop?br.find(r=>r.top):e.ordenLast?br[br.length-1]:br[e.orden];
    G.escenario=e.n;
  }else if(o.modo==="directo"){start=rs.find(r=>r.id===o.inicio);G.edad=start.tier>=6?54:start.tier>=5?48:42}
  else start=rs.find(r=>r.id===(G.origen==="diplomatico"?"diplomacia0":"politica0"));
  setCargo(start);
  nuevoTurno();save();show("game");
}
function setCargo(r){
  const mismo=G.cargo===r.id;
  G.cargo=r.id;G.aniosCargo=0;G.mandatoAnios=0;G.mandatos=mismo?G.mandatos+1:1;
  if(!mismo)G.hist.push({anio:G.anio,cargo:r.nombre,tier:r.tier,kind:r.kind});
  G.maxTier=Math.max(G.maxTier,r.tier);
  if(!G.ramas.includes(r.rama))G.ramas.push(r.rama);
  if(!G.kinds.includes(r.kind))G.kinds.push(r.kind);
  if(r.top){G.llegoTop=true;G.topMandatos=(G.topMandatos||0)+1}
}
function sinCargo(motivo){const r=rk(G.cargo);G.ultTier=r?r.tier:G.ultTier;if(r?.top){G.exTop=true;G.topSalida=G.anio}G.cargo=null;G.aniosCargo=0;G.hist.push({anio:G.anio,cargo:"Sin cargo"+(motivo?" · "+motivo:""),tier:0})}
function nuevoTurno(){
  const r=rk(G.cargo),tg=r?KIND_TAGS[r.kind]:["fuera"];
  const ok=i=>(tg.includes(EV[i].t)||EV[i].t==="g")&&(!EV[i].p||EV[i].p===G.pais)&&(!EV[i].pr||EV[i].pr===G.prov);
  let pool=EV.map((e,i)=>i).filter(i=>ok(i)&&!G.usados.includes(i));
  if(pool.length<3){G.usados=G.usados.filter(i=>!ok(i));pool=EV.map((e,i)=>i).filter(ok)}
  const propios=pool.filter(i=>EV[i].t!=="g"),locales=propios.filter(i=>EV[i].pr),pais=propios.filter(i=>EV[i].p),x=R();
  const a=locales.length&&x<.3?pick(locales):pais.length&&x<.6?pick(pais):propios.length&&x<.88?pick(propios):pick(pool);
  G.cola=[a];G.usados.push(a);G.ev=0;G.fase="evento";
  G.turnos=(G.turnos||0)+1;
  const pools={loc:["tira","agenda","fiscal"],leg:["poroteo","agenda","tira"],terr:["crisis","tira","fiscal","agenda"],gob:["crisis","tira","agenda","poroteo"],top:["crisis","agenda","poroteo","tira"],dip:["tira","agenda","fiscal"]};
  const pl=r?pools[r.kind].filter(m=>m!==G.lastMini):[];
  G.mini=(pl.length&&G.turnos>1&&!G.miniPrev&&R()<.55)?pick(pl):null;G.miniPrev=!!G.mini;if(G.mini)G.lastMini=G.mini;
}
function aplicar(ef){
  const out={};G.prevSt={...G.st};
  for(const k in ef){
    let v=ef[k];
    if(v>0){
      if(k==="l"&&G.rasgos.includes("carismatico"))v*=1.3;
      if(k==="e"&&G.rasgos.includes("tecnico"))v*=1.3;
      if(k==="i"&&G.rasgos.includes("poliglota"))v*=1.3;
      if((k==="p"||k==="n")&&G.rasgos.includes("negociador"))v+=2;
      if(k==="l"&&G.rasgos.includes("populista"))v+=2;
      if(k==="s"&&G.rasgos.includes("prolijo"))v*=.5;
    }else if(v<0){if(k==="i"&&G.rasgos.includes("populista"))v*=1.3}
    v=Math.round(v);const old=G.st[k];G.st[k]=clamp(old+v,0,100);out[k]=G.st[k]-old;
  }
  G.maxEsc=Math.max(G.maxEsc,G.st.s);G.lastD=out;G.anim=true;
  return out;
}
function elegir(i){
  const e=EV[G.cola[0]],op=e.o[i];
  const d=aplicar(op[1]);
  G.ult={res:op[2],d,elec:op[0]};G.fase="resultado";G.log.push({anio:G.anio,tit:e.tit,op:op[0]});
  save();vGame();
}
function seguir(){
  if(G.mini){G.fase="mini";G.lastD=null;save();vGame();return}
  finTurno();
}
function finTurno(){
  const r=rk(G.cargo);G.lastD=null;G.aviso=null;
  G.st.s=clamp(G.st.s-5,0,100);
  if(r&&["terr","gob","top"].includes(r.kind))G.st.l=clamp(G.st.l-2,0,100);
  if(r&&(r.kind==="gob"||r.kind==="top"))G.st.e=clamp(G.st.e+Math.round((R()-.5)*8),0,100);
  G.puntos+=r?r.tier*24:6;G.aniosCargo+=2;G.mandatoAnios+=2;G.anio+=2;G.edad+=2;
  if(G.st.p<=6)return fin("Tu partido te expulsó. Sin estructura, tu carrera termina acá.");
  if(G.st.s>=100)return fin("Procesado por la Justicia. Tu carrera termina en tribunales.");
  if(r?.top&&G.st.l<=6)return fin("Juicio político. Te remueven del cargo.");
  if(G.edad>=74)return fin("Llegó la hora. Con "+G.edad+" años, te retirás de la política y empezás a escribir tus memorias.");
  if(G.edad>=64&&(!G.retiroUlt||G.edad-G.retiroUlt>=4)&&R()<.5){G.fase="retiro";save();vGame();return}
  siguientePaso();
}
function siguientePaso(){
  const r=rk(G.cargo);
  if(r&&r.via==="nombramiento"&&(G.st.p<18||G.st.n<12)&&R()<.7){sinCargo("renuncia");G.aviso="Te pidieron la renuncia: perdiste el apoyo para seguir en el cargo.";G.ofertas=ofertas(true);G.fase="ofertas";save();vGame();return}
  const term=r?(r.top?PAISES[G.pais].top.term:4):0;
  if(r&&r.via==="eleccion"&&G.mandatoAnios>=term){
    G.fase="mandato";G.ofertas=ofertas(r.top&&G.mandatos>=PAISES[G.pais].top.max,true);save();vGame();return;
  }
  if(!r||(r.via==="nombramiento"&&G.aniosCargo>=2)){
    const of=ofertas(!r);
    if(of.length){G.ofertas=of;G.fase="ofertas";save();vGame();return}
  }
  nuevoTurno();save();vGame();
}
function chance(r){
  const s=G.st;
  if(r.via==="eleccion")return .22+(s.l+s.p-100)/180;
  if(r.kind==="dip")return .22+(s.i+s.p*.5+s.n*.5-100)/180;
  return .22+(s.p+s.n-100)/180;
}
function topElegible(){
  const reg=REGLA[G.pais],tm=G.topMandatos||0,term=PAISES[G.pais].top.term;
  if(reg==="unico"&&tm>=1)return false;
  if(reg==="total"&&tm>=2)return false;
  if(reg==="consec"&&G.topSalida&&G.anio-G.topSalida<term)return false;
  return true;
}
function estimarVoto(){const s=G.st;return (.5*s.l+.25*s.p+.25*s.n+PESO[partidoDe()[2]].voto)*.5+23}
function ofertas(forzar){
  const all=rangos(G.pais),cur=rk(G.cargo),t=cur?cur.tier:G.ultTier,exP=G.exTop||cur?.top;
  const c=[];let top=null;
  for(const r of all){
    if(cur&&r.id===cur.id)continue;
    if(r.top){if(!cur?.top&&(t>=4||G.exTop)&&topElegible()){const est=estimarVoto();top={r,p:est>=50?.7:est>=45?.45:.2}}continue}
    let ok=false,bonus=0;
    if(exP){ok=r.kind==="leg"&&r.tier===4}
    else if(cur&&r.rama===cur.rama&&r.orden===cur.orden+1){ok=true;bonus=.25}
    else if(r.kind==="dip"&&r.tier<=3&&cur?.kind!=="dip"){ok=false}
    else if(!cur){ok=r.tier>=Math.max(1,t-1)&&r.tier<=t}
    else ok=r.rama!==cur.rama&&(r.tier===t||r.tier===t+1);
    if(!ok)continue;
    c.push({r,p:clamp(chance(r)+bonus+(exP?.4:0),.05,.95)});
  }
  let of=c.filter(x=>R()<x.p);
  if(!of.length&&forzar&&c.length)of=[c.sort((a,b)=>b.p-a.p)[0]];
  of.sort((a,b)=>b.r.tier-a.r.tier);
  of=of.slice(0,top?2:3);if(top)of.unshift(top);
  return of.map(x=>({id:x.r.id,p:x.p}));
}

/* Elecciones */
function eleccion(r,reel,bonus,rival){
  const s=G.st,P=PAISES[G.pais];
  let base=.5*s.l+.25*s.p+.25*((reel&&r.top)?s.e:s.n);
  if(reel)base+=r.top?(s.e-50)*.15:3;
  if(G.rasgos.includes("carismatico"))base+=3;
  base+=PESO[partidoDe()[2]].voto;
  const curT=rk(G.cargo)?.tier||G.ultTier||1,gap=Math.max(0,r.tier-curT-1);
  let pct=clamp(Math.round((base*.5+23+(R()-.5)*20+(bonus||0)-gap*4)*10)/10,8,72);
  const rn=`${rival.n} (${rival.pa})`;
  let gano,txt,rpct;
  if(r.top){
    const m=P.top.modo;
    if(m==="balotaje"){
      rpct=Math.round((pct-6+R()*12)*10)/10;
      if(pct>=45||(pct>=40&&pct-rpct>=10)){gano=true;txt=`Ganás en primera vuelta: ${pct}% contra ${rpct}% de ${rn}.`}
      else{const p2=clamp(Math.round((pct+12+(R()-.45)*14+(s.l-50)*.15+(bonus||0)*.5)*10)/10,30,70);gano=p2>=50;txt=`Primera vuelta: ${pct}%. En el balotaje contra ${rn}: ${p2}% a ${Math.round((100-p2)*10)/10}%.`;pct=p2;rpct=Math.round((100-p2)*10)/10}
    }else if(m==="colegio"){
      const ev=clamp(Math.round(270+(pct-48)*22+(R()-.5)*60),60,480);gano=ev>=270;rpct=Math.round((100-pct-3)*10)/10;txt=`${pct}% del voto popular contra ${rpct}% de ${rn}. Colegio Electoral: ${ev} a ${538-ev}.`;
    }else if(m==="escanios"){
      const tot=P.top.esc,maj=Math.floor(tot/2)+1,seats=clamp(Math.round(tot*(pct/100)*1.18),20,tot-20);rpct=Math.round((pct-5+R()*10)*10)/10;
      if(seats>=maj){gano=true;txt=`Tu partido saca ${seats} de ${tot} bancas: mayoría absoluta. ${rn} queda segundo.`}
      else if(seats>=tot*.4&&R()<.35+(s.n-50)/100+(s.p-50)/200){gano=true;txt=`Sacás ${seats} de ${tot} bancas. Sin mayoría, armás una coalición y le ganás la investidura a ${rn}.`}
      else{gano=false;txt=`Sacás ${seats} de ${tot} bancas. ${rn} arma gobierno.`}
    }else{rpct=Math.round((30+R()*16)*10)/10;gano=pct>rpct;txt=`${pct}% contra ${rpct}% de ${rn}.`}
  }else{
    rpct=Math.round((34+R()*15+r.tier*1.2)*10)/10;gano=pct>rpct;txt=`${pct}% contra ${rpct}% de ${rn}.`;
  }
  if(gano){G.elecG++;G.racha=0}else{G.elecP++;G.racha=(G.racha||0)+1}
  return{gano,txt,pct,rpct:rpct??Math.round((100-pct)*10)/10};
}
function aceptar(id,reel){
  const r=rangos(G.pais).find(x=>x.id===id);
  G.pista=null;G.aviso=null;
  if(r.via==="eleccion"){
    const rival=R()<.45?{...G.nemesis,nem:true}:nuevoRival();
    const jp=(r.tier>=4?["debate","debate","recorrida","fiscal"]:["recorrida","recorrida","fiscal","debate"]).filter(x=>x!==G.lastCamp);const juego=pick(jp);G.lastCamp=juego;
    G.pendElec={id:r.id,reel,prev:G.fase,rival,juego,postu:!!G.postulando};G.postulando=false;G.fase="campania";
    if(r.top&&!reel){
      const s=G.st,cT=rk(G.cargo)?.tier||G.ultTier||1,leg=.45*s.p+.35*s.n+.2*s.l-Math.max(0,4-cT)*5,pInt=clamp((leg-28)/40,.08,.95),gano=R()<pInt;
      const N=NOMBRES[G.pais],pct=gano?Math.round((50+R()*25)*10)/10:Math.round((28+R()*21)*10)/10;
      G.interna={gano,pct,rival:pick(N[0])+" "+pick(N[1]),leg:Math.round(leg)};G.fase="interna";
    }
  }else{
    setCargo(r);G.asuncion={cargo:r.nombre,tier:r.tier,via:"Nombramiento"};G.fase="asuncion";
  }
  save();vGame();
}
function resolverEleccion(bonus){
  const pe=G.pendElec,r=rangos(G.pais).find(x=>x.id===pe.id);
  const res=eleccion(r,pe.reel,bonus,pe.rival);
  G.elec={...res,cargo:r.nombre,id:r.id,reel:pe.reel,rival:pe.rival,bonus,tier:r.tier,postu:pe.postu};G.fase="eleccion";G.pendElec=null;
  if(res.gano){if(pe.rival.nem)G.nemWins=(G.nemWins||0)+1;setCargo(r)}
  else if(G.cargo===r.id||pe.reel||pe.prev==="mandato")sinCargo("derrota");

}
function contEleccion(){
  const e=G.elec,post=e.postu;G.elec=null;
  if(G.racha>=3)return fin("Tres derrotas seguidas. Tu partido te soltó la mano y tu carrera se termina acá.");
  if(e.gano&&!e.reel){G.asuncion={cargo:e.cargo,tier:e.tier,via:"Elección",postu:post};G.fase="asuncion";save();vGame();return}
  if(post)return finTurno();
  nuevoTurno();save();vGame();
}
function contInterna(){
  const it=G.interna,pe=G.pendElec;G.interna=null;
  if(it.gano){G.fase="campania";save();vGame();return}
  G.pendElec=null;if(pe.prev==="mandato")sinCargo("perdió la interna");
  if(pe.postu)return finTurno();
  nuevoTurno();save();vGame();
}
function rechazar(){G.pista=null;G.aviso=null;nuevoTurno();save();vGame()}

function fin(motivo){
  G.fin=motivo;G.vista="legado";clearMG();
  const s=G.st,logros=[];
  if(G.llegoTop)logros.push(G.topMandatos>=2?"Presidente reelecto":"Llegó a la cima");
  if(G.elecG>=3)logros.push(`Ganó ${G.elecG} elecciones`);
  if(G.ramas.length>=3)logros.push("Pasó por las tres ramas");
  if(G.nemWins)logros.push(`Le ganó a ${G.nemesis.n}`);
  if(G.maxEsc>=60&&s.s<40&&!motivo.startsWith("Procesado"))logros.push("Sobrevivió a un escándalo");
  if(G.elecP===0&&G.elecG>0)logros.push("Invicto en las urnas");
  const finales=Math.round((s.l+s.i+s.n+s.e+s.p)/2-s.s);
  G.puntosFinal=Math.max(0,G.puntos+finales+logros.length*60+(G.llegoTop?250:0)+(G.topMandatos>=2?150:0)-(motivo.startsWith("Procesado")?200:0));
  G.logros=logros;G.titulo=titulo();
  clearSave();try{localStorage.setItem("elmandato.ultimo",JSON.stringify(G))}catch(e){}
  if(G.diario&&!G.yaJugado){try{localStorage.setItem("elmandato.diario",hoyISO())}catch(e){}}
  guardarRanking();
  show("legado");

function titulo(){
  const s=G.st,top=G.llegoTop,K=G.hist.filter(h=>h.tier);
  const tuvo=(kind,tier)=>K.some(h=>h.kind===kind&&h.tier>=tier);
  if(G.fin.startsWith("Procesado")||s.s>=80)return"Prontuario Abierto";
  if(top&&G.topMandatos>=2)return"Leyenda Nacional";
  if(top&&s.i>=68)return"Estadista Global";
  if(top&&s.e>=68)return"Arquitecto de la Estabilidad";
  if(top&&s.l>=68)return"Ídolo Popular";
  if(top&&s.n>=68)return"Republicano de Ley";
  if(top)return"El que llegó";
  if(tuvo("dip",5))return"Canciller de Hierro";
  if(tuvo("terr",5))return"Caudillo Territorial";
  if(tuvo("gob",4))return"Ministro de Hierro";
  if(tuvo("leg",4))return"Lobo del Senado";
  if(s.p>=75)return"Soldado del Partido";
  if(G.maxTier<=2)return"Militante de Base";
  return"Animal Político";
}

async function guardarRanking(){
  if(!SB||!SESSION)return;
  const msg=t=>{const el=$("#rkState");if(el)el.textContent=t};
  try{
    const uid=SESSION.user.id;
    const {data:cur,error:e1}=await SB.from("legados").select("*").eq("user_id",uid).maybeSingle();
    if(e1)throw e1;
    const d=cur?{...cur}:{user_id:uid,puntos:0};
    let ch=!cur;
    if(G.puntosFinal>(d.puntos||0)){
      const mejor=G.hist.filter(h=>h.tier).sort((a,b)=>b.tier-a.tier)[0];
      Object.assign(d,{nombre:String(G.nombre||"Jugador").slice(0,40),puntos:G.puntosFinal,titulo:G.titulo,pais:G.pais,cargo:mejor?.cargo||"",fecha:hoyISO()});ch=true;
    }
    if(G.diario&&!G.yaJugado&&d.diario_fecha!==hoyISO()){
      Object.assign(d,{diario_fecha:hoyISO(),diario_puntos:G.puntosFinal,diario_titulo:G.titulo,diario_pais:G.pais});
      if(!d.nombre)d.nombre=String(G.nombre||"Jugador").slice(0,40);ch=true;
    }
    if(ch){d.updated_at=new Date().toISOString();const {error}=await SB.from("legados").upsert(d);if(error)throw error}
    G.guardado=true;msg(ch?"Guardado en el ranking.":"Tu mejor legado sigue siendo uno anterior.");
  }catch(e){msg("No se pudo guardar en el ranking. Probá de nuevo más tarde.")}
}

  if(G.fase==="campania"){const j=G.pendElec.juego;if(j==="debate")return mountDebate();if(j==="fiscal")return mountFiscal(ok=>{const bonus=[-5,-3,-1,1,4,7][ok];$("#fz").innerHTML=`<div class="mg-end"><b>${ok} de 5</b><span>${ok>=4?"Cuidaste cada voto.":ok>=2?"Fiscalización floja.":"Te robaron votos en las mesas."} ${bonus>=0?"+":""}${bonus} puntos en la elección</span><button class="btn primary" id="mgFin">Ver el escrutinio</button></div>`;$("#mgFin").onclick=()=>resolverEleccion(bonus)});return mountRecorrida()}
  if(G.fase==="mini")return ({poroteo:mountPoroteo,crisis:mountCrisis,tira:mountTira,agenda:mountAgenda,fiscal:()=>mountFiscal(ok=>{
    if(ok>=5)return terminarMini("Ojo de halcón","Encontraste todas las irregularidades.",{n:5,s:-3,l:2});
    if(ok>=3)return terminarMini("Buena auditoría","Detectaste casi todo.",{n:3,s:-1});

function terminarMini(tit,txt,ef){clearMG();const d=aplicar(ef);G.miniRes={tit,txt,d};G.fase="mini_res";save();vGame()}

function mountRecorrida(){
  const arena=$("#arena");let score=0,t=12,run=false;
  const traps=["Escándalo","Abucheo","Fake news","Huevazo"];
  $("#mgGo").onclick=()=>{
    if(run)return;run=true;arena.innerHTML="";
    MGT.push(setInterval(()=>{t--;const el=$("#mgT");if(el)el.textContent=t;if(t<=0)end()},1000));
    MGT.push(setInterval(spawn,520));spawn();
  };
  function spawn(){
    const trap=Math.random()<.27,b=document.createElement("button");
    b.type="button";b.className="pop"+(trap?" trap":"");b.textContent=trap?pickM(traps):pickM(CIUDADES[G.pais]);
    const W=arena.clientWidth,H=arena.clientHeight;
    b.style.left=Math.max(4,Math.random()*(W-140))+"px";b.style.top=Math.max(4,Math.random()*(H-46))+"px";
    b.onclick=()=>{if(b.dataset.hit)return;b.dataset.hit="1";score+=trap?-2:1;$("#mgS").textContent=score;b.classList.add("hit");b.textContent=trap?"−2":"+1";setTimeout(()=>b.remove(),250)};
    arena.appendChild(b);MGT.push(setTimeout(()=>b.remove(),1150));
  }
  function end(){
    clearMG();const bonus=clamp(Math.round((score-7)*.9),-5,8);
    arena.innerHTML=`<div class="mg-end"><b>${score} votos</b><span>${bonus>=0?"+":""}${bonus} puntos en la elección</span><button class="btn primary" id="mgFin">Ver el escrutinio</button></div>`;
    $("#mgFin").onclick=()=>resolverEleccion(bonus);
  }
}
const ATQ={
  dato:{n:"Dato",resp:"Refutar",l:["Con vos la deuda creció un 40%.","Dejaste tres obras sin terminar.","El delito subió en tu gestión.","Tu presupuesto tiene un agujero enorme.","Prometiste empleo y bajó."]},
  chicana:{n:"Chicana",resp:"Humor",l:["¿Ese traje lo pagó el Estado?","Te vi más en la tele que en la oficina.","Hablás mucho para alguien que no ganó nada.","¿Tu asesor de imagen está de vacaciones?","Hasta tu partido te esquiva."]},
  trampa:{n:"Trampa",resp:"Esquivar",l:["¿Sí o no: vas a subir impuestos?","¿Quién financia tu campaña? Nombres.","¿Votarías a tu propio candidato a vice?","¿Le pedís perdón a tu partido, sí o no?","¿Cuánto cuesta un kilo de pan?"]},
};
function mountDebate(){
  const box=$("#db");let i=0,ok=0;const N=6;
  $("#mgGo").onclick=next;
  function next(){
    clearMG();
    if(i>=N)return done();
    const k=pickM(Object.keys(ATQ)),a=ATQ[k],ms=Math.max(1500,3000-i*260);
    box.innerHTML=`<div class="mg-top"><span>Ataque ${i+1} de ${N}</span><span>Bien <b>${ok}</b></span></div><div class="tbar"><i id="dbB"></i></div>
      <div class="attack"><span class="atype t-${k}">${a.n}</span><p>${esc(pickM(a.l))}</p></div>
      <div class="resp">${shuffle(["Refutar","Humor","Esquivar"]).map(x=>`<button class="btn" data-r="${x}">${x}</button>`).join("")}</div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$("#dbB");if(b){b.style.transition=`width ${ms}ms linear`;b.style.width="0%"}}));
    MGT.push(setTimeout(()=>answer(null),ms));
    box.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>answer(b.dataset.r));
    function answer(x){
      clearMG();const good=x===a.resp;if(good)ok++;
      box.querySelectorAll("[data-r]").forEach(b=>{b.disabled=true;if(b.dataset.r===a.resp)b.classList.add("ok");else if(b.dataset.r===x)b.classList.add("bad")});
      i++;MGT.push(setTimeout(next,good?450:800));
    }
  }
  function done(){
    const bonus=[-5,-4,-2,0,2,5,8][ok];
    box.innerHTML=`<div class="mg-end"><b>${ok} de ${N}</b><span>${ok>=5?"Lo pasaste por arriba.":ok>=3?"Debate parejo.":"Te comió el debate."} ${bonus>=0?"+":""}${bonus} puntos en la elección</span><button class="btn primary" id="mgFin">Ver el escrutinio</button></div>`;
    $("#mgFin").onclick=()=>resolverEleccion(bonus);
  }
}
function mountFiscal(cb){
  const box=$("#fz");let i=0,ok=0;const N=5,sizes=[9,9,12,12,16];
  $("#mgGo").onclick=next;
  function next(){
    clearMG();
    if(i>=N)return cb(ok);
    const n=sizes[i],base=1000+Math.floor(Math.random()*8000),s=String(base).split(""),a=Math.floor(Math.random()*3);
    [s[a],s[a+1]]=[s[a+1],s[a]];if(s.join("")===String(base))s[3]=String((+s[3]+1)%10);
    const odd=+s.join(""),pos=Math.floor(Math.random()*n),ms=Math.max(2600,5200-i*550),fmt=v=>v.toLocaleString("es-AR");
    box.innerHTML=`<div class="mg-top"><span>Mesa ${i+1} de ${N}</span><span>Bien <b>${ok}</b></span></div><div class="tbar"><i id="fzB"></i></div>
      <p class="muted" style="margin:0">Todas las actas dicen <b>${fmt(base)}</b> votos. Encontrá la adulterada.</p>
      <div class="actas" style="grid-template-columns:repeat(${n>12?4:3},minmax(0,1fr))">${Array.from({length:n},(_,j)=>`<button class="acta" data-j="${j}">${fmt(j===pos?odd:base)}</button>`).join("")}</div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$("#fzB");if(b){b.style.transition=`width ${ms}ms linear`;b.style.width="0%"}}));
    MGT.push(setTimeout(()=>answer(-1),ms));
    box.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>answer(+b.dataset.j));
    function answer(j){
      clearMG();const good=j===pos;if(good)ok++;
      box.querySelectorAll("[data-j]").forEach(b=>{b.disabled=true;if(+b.dataset.j===pos)b.classList.add("ok");else if(+b.dataset.j===j)b.classList.add("bad")});
      i++;MGT.push(setTimeout(next,good?450:900));
    }
  }
}
function mountAgenda(){
  const btns=[...app.querySelectorAll(".ag")],lens=[3,4,5,6];let ri=0,seq=[],k=0,lock=true,done=0;
  $("#mgGo").onclick=()=>{$("#mgGo").remove();ronda()};
  function ronda(){
    clearMG();
    if(ri>=lens.length)return fin();
    seq=Array.from({length:lens[ri]},()=>Math.floor(Math.random()*4));k=0;lock=true;
    $("#agR").textContent=`Ronda ${ri+1} de ${lens.length}`;$("#agM").textContent="Mirá el orden";
    const sp=Math.max(380,650-ri*80);
    seq.forEach((b,x)=>{MGT.push(setTimeout(()=>flash(b),400+x*sp))});
    MGT.push(setTimeout(()=>{lock=false;$("#agM").textContent="Repetilo"},400+seq.length*sp));
  }
  function flash(b,cls="lit"){btns[b].classList.add(cls);MGT.push(setTimeout(()=>btns[b].classList.remove(cls),260))}
  btns.forEach((b,x)=>b.onclick=()=>{
    if(lock)return;flash(x,"tap");
    if(x!==seq[k]){lock=true;b.classList.add("bad");$("#agM").textContent="Te equivocaste de reunión";MGT.push(setTimeout(()=>{b.classList.remove("bad");fin()},800));return}
    k++;if(k===seq.length){lock=true;done++;ri++;$("#agM").textContent="¡Bien!";MGT.push(setTimeout(ronda,700))}
  });
  function fin(){
    if(done>=4)return terminarMini("Agenda perfecta","Atendiste a todos en el orden justo. Nadie se sintió ninguneado.",{p:4,n:4,l:2});
    if(done>=2)return terminarMini("Agenda cumplida","Algún plantón hubo, pero zafaste.",{p:2,n:1});
    if(done===1)return terminarMini("Agenda caótica","Dejaste plantados a varios.",{p:-2,n:-2});
    terminarMini("Plantaste a todos","Los gremios, la prensa y tu partido se quejan.",{p:-4,n:-3,l:-2});
  }
}
function mountPoroteo(){
  const seats=[...app.querySelectorAll(".seat")],rounds=[3,4,5];let ri=0,hits=0,total=0,picks=0,target=[];
  $("#mgGo").onclick=()=>{$("#mgGo").remove();ronda()};
  function ronda(){
    clearMG();
    if(ri>=3)return done();
    $("#poR").textContent=`Ronda ${ri+1} de 3`;$("#poM").textContent="Memorizá";
    seats.forEach(s=>{s.className="seat";s.disabled=true});
    target=shuffle(seats.map((_,i)=>i)).slice(0,rounds[ri]);picks=0;total+=rounds[ri];
    target.forEach(i=>seats[i].classList.add("lit"));
    MGT.push(setTimeout(()=>{
      target.forEach(i=>seats[i].classList.remove("lit"));
      $("#poM").textContent=`Marcá ${rounds[ri]} bancas`;
      seats.forEach(s=>{s.disabled=false});
    },1100+ri*150));
  }
  seats.forEach(s=>s.onclick=()=>{
    if(s.disabled)return;s.disabled=true;const i=+s.dataset.s;
    if(target.includes(i)){s.classList.add("ok");hits++;picks++;if(picks===rounds[ri]){ri++;MGT.push(setTimeout(ronda,600))}}
    else{s.classList.add("bad");target.forEach(t=>{if(!seats[t].classList.contains("ok"))seats[t].classList.add("miss")});seats.forEach(x=>x.disabled=true);ri++;MGT.push(setTimeout(ronda,900))}
  });
  function done(){
    if(hits>=total)return terminarMini("Poroteo perfecto","Contaste cada voto. La ley sale con holgura.",{p:5,n:4,l:2});
    if(hits>=total-3)return terminarMini("Sale por poco","Ganaste la votación por un voto.",{p:3,n:2});
    if(hits>=total-6)return terminarMini("Te faltaron votos","La ley vuelve a comisión.",{p:-2,l:-1});
    terminarMini("Derrota en el recinto","Tus aliados te dieron vuelta la cara.",{p:-5,n:-3,l:-2});
  }
}
function mountCrisis(){
  const els=[...app.querySelectorAll(".front")],lv=[70,70,70,70],rate=els.map(()=>4+Math.random()*3.5),dead=[false,false,false,false];let t=15,t0=0,last=0;
  $("#mgGo").onclick=()=>{
    $("#mgGo").remove();els.forEach(e=>e.disabled=false);t0=last=performance.now();
    MGT.push(setInterval(()=>{t--;const el=$("#crT");if(el)el.textContent=Math.max(0,t);if(t<=0)done()},1000));
    MGRAF=requestAnimationFrame(tick);
  };
  els.forEach((e,i)=>e.onclick=()=>{if(dead[i])return;lv[i]=Math.min(100,lv[i]+26);paint()});
  function tick(now){
    const dt=(now-last)/1000;last=now;const boost=1+(now-t0)/15000;
    lv.forEach((v,i)=>{if(dead[i])return;lv[i]=v-rate[i]*boost*dt*2.2;if(lv[i]<=0){lv[i]=0;dead[i]=true;els[i].classList.add("dead");els[i].disabled=true;const f=$("#crF");if(f)f.textContent=dead.filter(x=>!x).length}});
    paint();MGRAF=requestAnimationFrame(tick);
  }
  function paint(){els.forEach((e,i)=>{const b=e.querySelector("i");b.style.width=lv[i]+"%";b.style.background=lv[i]>45?"var(--good)":lv[i]>20?"var(--warn)":"var(--bad)"})}
  function done(){
    clearMG();const caidos=dead.filter(Boolean).length,avg=lv.reduce((a,b)=>a+b,0)/4;
    if(!caidos&&avg>=50)return terminarMini("Gestión impecable","Apagaste todos los incendios y encima quedaste bien parado.",{l:5,n:3,e:3});
    if(!caidos)return terminarMini("Crisis controlada","Sudaste, pero no se cayó nada.",{l:3,n:2});
    if(caidos===1)return terminarMini("Se te escapó un frente","Un frente se te fue de las manos y los medios lo destacan.",{l:-2,n:-1});
    terminarMini("Caos total","La crisis te pasó por encima.",{l:-5,n:-3,e:-3});
  }
}
function mountTira(){
  const g=$("#gauge"),z=$("#zone"),nd=$("#needle"),btn=$("#mgGo"),W=[24,16,10],P=[1700,1250,900];let ri=0,hits=0,pos=0,dir=1,zs=0,run=false,last=0;
  function setZone(){zs=8+Math.random()*(84-W[ri]);z.style.left=zs+"%";z.style.width=W[ri]+"%"}
  setZone();
  btn.onclick=()=>{
    if(!run){run=true;btn.textContent="¡Cerrar!";last=performance.now();MGRAF=requestAnimationFrame(tick);return}
    const hit=pos>=zs&&pos<=zs+W[ri];if(hit)hits++;
    $("#tiS").textContent=hits;g.classList.add(hit?"ok":"bad");run=false;cancelAnimationFrame(MGRAF);btn.disabled=true;ri++;
    MGT.push(setTimeout(()=>{
      g.classList.remove("ok","bad");btn.disabled=false;
      if(ri>=3)return done();
      $("#tiR").textContent=`Ronda ${ri+1} de 3`;setZone();btn.textContent="Arrancar";
    },700));
  };
  function tick(now){
    const dt=now-last;last=now;pos+=dir*(100/P[ri])*dt;
    if(pos>=100){pos=100;dir=-1}if(pos<=0){pos=0;dir=1}
    nd.style.left=pos+"%";MGRAF=requestAnimationFrame(tick);
  }
  function done(){
    const k=rk(G.cargo)?.kind,dip=k==="dip";
    if(hits===3)return terminarMini("Cerraste justo","Acuerdo redondo, sin ceder de más.",dip?{i:6,e:3,n:2}:{n:5,e:3,p:2});
    if(hits===2)return terminarMini("Acuerdo firmado","Cediste un poco, pero cerraste.",dip?{i:3,e:1}:{n:3,e:1});
    if(hits===1)return terminarMini("Acuerdo caro","Firmaste dando más de lo necesario.",dip?{i:-1,e:-3}:{n:1,e:-4});
    terminarMini("Se rompió la mesa","No hubo acuerdo y se viene el conflicto.",dip?{i:-6,l:-2}:{n:-6,l:-3,e:-3});
  }
}

${tray.slice(-4).join(" → ")}
Local ${sq(s.l)}

    <div class="stats">${Object.keys(ST).map(k=>`<div class="stat"><span>${ST[k]}</span><span class="bar"><i style="width:${s[k]}%;background:${colorFor(k,s[k])}"></i></span><span class="v">${s[k]}</span></div>`).join("")}</div>
