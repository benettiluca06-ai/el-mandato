<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Mandato</title>
<meta name="description" content="Simulador de carrera política internacional: elegí tu país, subí de cargo y mirá tu legado.">
<meta property="og:title" content="El Mandato">
<meta property="og:description" content="De concejal a la ONU. ¿Qué legado dejás?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: portal de cancillería — barra superior, columna principal + lateral; el juego es un "cable" diplomático con legajo al costado */
:root{
  --bg:#ECEFEA; --surface:#FAFBF8; --sunk:#E2E6DF; --ink:#16202E; --muted:#576274; --line:#CDD3CA;
  --accent:#1E4E8C; --accent-ink:#FFFFFF; --seal:#9E2B25;
  --good:#2E7D4F; --warn:#A86C12; --bad:#B4382F;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#0B1017; --ink:#E5E9EF; --muted:#97A2B2; --line:#283343;
  --accent:#86ADE3; --accent-ink:#0E141C; --seal:#E5867A; --good:#62C08B; --warn:#E3AE52; --bad:#E57C70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#0B1017; --ink:#E5E9EF; --muted:#97A2B2; --line:#283343;
  --accent:#86ADE3; --accent-ink:#0E141C; --seal:#E5867A; --good:#62C08B; --warn:#E3AE52; --bad:#E57C70; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0}
.brand h1{font-size:30px;text-transform:uppercase}
.brand .seal{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--seal);border:1.5px solid var(--seal);padding:1px 6px;border-radius:3px;transform:rotate(-3deg)}
.who{display:flex;align-items:center;gap:8px;font-size:13.5px}
.who img{width:28px;height:28px;border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);border:1.5px solid var(--ink);background:transparent;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Ads */
.ad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px dashed var(--line);background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--line) 35%,transparent) 10px 11px);color:var(--muted);border-radius:var(--r);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ad.leader{height:90px;margin-top:14px}
.ad.box{height:250px}
.ad.inline{height:100px}

/* Home grid */
.home{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;margin-top:22px}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);overflow:hidden}
.hero .l{padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px}
.hero h2{font-size:46px;text-transform:uppercase}
.hero p{margin:0;max-width:52ch;color:var(--muted)}
.hero .r{background:var(--ink);color:var(--bg);padding:18px;display:flex;flex-direction:column;gap:8px;font-family:var(--f-mono);font-size:12.5px}
.ladder{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ladder div{display:flex;justify-content:space-between;border-bottom:1px solid color-mix(in srgb,var(--bg) 22%,transparent);padding-bottom:5px}
.ladder b{font-weight:500}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.sec-h h3{font-size:22px;text-transform:uppercase}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fcard{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left}
.fcard.daily{border:1.5px solid var(--seal)}
.fcard h4{margin:0;font-family:var(--f-display);font-size:21px;font-weight:800;text-transform:uppercase;line-height:1.05}
.fcard p{margin:0;font-size:13.5px;color:var(--muted)}
.fcard .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:3px;background:var(--sunk);color:var(--ink)}
.news{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.news a{display:flex;flex-direction:column;gap:2px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.news a:nth-child(odd){padding-right:16px}
.news a:nth-child(even){padding-left:16px;border-left:1px solid var(--line)}
.news a span:first-child{font-weight:600}
.news a span:last-child{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 9px;font-size:12.5px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rank .pos{font-family:var(--f-mono);color:var(--muted)}
.rank .nm{min-width:0}
.rank .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .nm span{font-size:12px;color:var(--muted)}
.rank .pts{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.empty{padding:14px;border:1px dashed var(--line);border-radius:var(--r);font-size:13.5px;color:var(--muted)}
.howto{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.howto div{display:grid;grid-template-columns:22px 1fr;gap:6px}
.howto b{font-family:var(--f-mono);color:var(--seal)}

/* Setup */
.setup{margin-top:22px;display:flex;flex-direction:column;gap:22px;max-width:860px}
.setup h2{font-size:40px;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:8px}
.field > label,.field > .lab{font-weight:600}
input[type=text]{font:inherit;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:360px}
.grid-c{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface)}
.opt b{font-family:var(--f-display);font-size:19px;font-weight:800;text-transform:uppercase;line-height:1.1}
.opt span{font-size:12px;color:var(--muted)}
.opt .code{font-family:var(--f-mono);font-size:11px;color:var(--seal);letter-spacing:.1em}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{color:inherit;opacity:.7}

/* Game */
.game{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;margin-top:20px;align-items:start}
.legajo{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
.legajo h3{font-size:26px;text-transform:uppercase}
.cargo{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--accent);line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.stats{display:flex;flex-direction:column;gap:8px}
.stat{display:grid;grid-template-columns:96px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12.5px}
.bar{height:8px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .4s ease}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.tray{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:5px;font-size:12.5px;max-height:180px;overflow:auto}
.tray li{padding-left:10px;position:relative}
.tray li::before{content:"";position:absolute;left:-5px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.tray li:last-child::before{background:var(--accent)}
.tray .y{font-family:var(--f-mono);color:var(--muted);margin-right:6px}
.cable{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cable-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em}
.cable-b{padding:20px 18px 22px;display:flex;flex-direction:column;gap:14px}
.cable-b h2{font-size:34px;text-transform:uppercase}
.cable-b .txt{font-size:16px;max-width:62ch;margin:0}
.stamp{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--seal);border:1.5px solid var(--seal);padding:2px 8px;border-radius:3px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg)}
.choice:hover{border-color:var(--accent)}
.choice .k{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.choice small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.d{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:3px;background:var(--sunk)}
.d.up{color:var(--good)} .d.down{color:var(--bad)}
.res{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:0;font-size:15px}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg)}
.offer b{font-family:var(--f-display);font-size:20px;font-weight:800;text-transform:uppercase}
.offer span{display:block;font-size:12.5px;color:var(--muted)}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vote{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* Legacy */
.legacy{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
.lcard{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:16px}
.ltitle{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,8vw,72px);text-transform:uppercase;line-height:.95;color:var(--seal)}
.lpts{font-family:var(--f-mono);font-size:15px}
.timeline{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.timeline div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.timeline span{font-family:var(--f-mono);color:var(--muted);font-size:12.5px}
.logros{display:flex;flex-wrap:wrap;gap:6px}
.share{width:100%;min-height:150px;font-family:var(--f-mono);font-size:12.5px;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.foot{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.adwrap{display:flex;flex-direction:column;gap:4px;min-width:0}
.adwrap .adlab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.leader{margin-top:14px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--ink) 55%,transparent)}
.mbox{width:100%;max-width:400px;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px}
.mbox h3{font-size:28px;text-transform:uppercase}
.mbox p{margin:0}
.mbox form{display:flex;flex-direction:column;gap:8px}
.mbox input{font:inherit;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
@media (max-width:900px){
  .home,.legacy{grid-template-columns:minmax(0,1fr)}
  .game{grid-template-columns:minmax(0,1fr)}
  .legajo{position:static}
  .ad.box{height:100px}
  .feat{grid-template-columns:minmax(0,1fr)}
  .grid-c{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero h2{font-size:38px}
  .news{grid-template-columns:minmax(0,1fr)}
  .news a:nth-child(n){padding:10px 0;border-left:0}
  .ad.leader{height:60px}
  .brand h1{font-size:22px;white-space:nowrap}
  .brand .seal{display:none}
  .cable-b h2{font-size:28px}
  .tray{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="goHome" aria-label="Volver al inicio"><h1>El Mandato</h1><span class="seal">Reservado</span></button>
    <div class="who" id="who"><span class="muted">Conectando…</span></div>
  </header>
  <div id="adTop"></div>
  <main id="app"></main>
  <div class="modal" id="login" hidden role="dialog" aria-modal="true" aria-labelledby="lgT">
   <div class="mbox">
    <h3 id="lgT">Ingresá</h3>
    <p class="muted">Guardá tus legados y entrá al ranking.</p>
    <button class="btn primary" id="lgGoogle" type="button">Continuar con Google</button>
    <div class="or"><span>o con tu mail</span></div>
    <form id="lgForm"><label for="lgMail" class="muted" style="font-size:13px">Te mandamos un link para entrar, sin contraseña.</label><input type="email" id="lgMail" required placeholder="tu@mail.com" autocomplete="email"><button class="btn" type="submit">Mandame el link</button></form>
    <p id="lgMsg" class="muted" aria-live="polite" style="font-size:13.5px"></p>
    <button class="btn ghost sm" id="lgClose" type="button">Cerrar</button>
   </div>
  </div>
  <footer class="foot"><span>El Mandato · países e instituciones reales, personajes ficticios · <a href="privacidad.html">Privacidad</a></span><span id="fecha"></span></footer>
</div>

const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
let G=null;
function R(){let t=(G.rs=(G.rs+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),1|t);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
const pick=a=>a[Math.floor(R()*a.length)];
function save(){try{localStorage.setItem("elmandato.partida",JSON.stringify(G))}catch(e){}}
function clearSave(){try{localStorage.removeItem("elmandato.partida")}catch(e){}}
function loadSave(){try{const s=localStorage.getItem("elmandato.partida");return s?JSON.parse(s):null}catch(e){return null}}

function rangos(pk){
  const P=PAISES[pk],out=[];
  for(const rama of ["politica","ejecutivo","diplomacia"]) P[rama].forEach((r,i,arr)=>out.push({id:rama+i,nombre:r[0],tier:r[1],via:r[2]==="e"?"eleccion":"nombramiento",rama,orden:i,top:rama==="ejecutivo"&&i===arr.length-1}));
  [...INTL,...(P.eu?INTL_EU:[])].forEach((r,i)=>out.push({id:"internacional"+i,nombre:r[0],tier:r[1],via:"nombramiento",rama:"internacional",orden:i}));
  return out;
}
const rk=id=>id?rangos(G.pais).find(r=>r.id===id):null;
const tpl=s=>s.replace(/\{P\}/g,PAISES[G.pais].n).replace(/\{B\}/g,PAISES[G.pais].bloque).replace(/\{C\}/g,PAISES[G.pais].cong);

  SB=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  try{const {data}=await SB.auth.getSession();SESSION=data.session}catch(e){}
  SB.auth.onAuthStateChange((ev,s)=>{SESSION=s;renderWho();if(s)$("#login").hidden=true;if(!G)subRanking()});
  renderWho();if(!G)subRanking();
}
function renderWho(){
  const w=$("#who");
  if(SESSION){
    const av=SESSION.user.user_metadata?.avatar_url;
    w.innerHTML=(av?'<img alt="">':'')+'<span></span><button class="btn sm ghost" id="btnOut">Salir</button>';
    if(av)w.querySelector("img").src=av;
    w.querySelector("span").textContent=nombreUsuario()||(SESSION.user.email||"Tu cuenta");
    $("#btnOut").onclick=()=>SB.auth.signOut();
  }else{
    w.innerHTML='<span class="muted">Invitado</span><button class="btn sm" id="btnLogin">Ingresar</button>';
    $("#btnLogin").onclick=abrirLogin;
  }
}
function abrirLogin(){
  $("#login").hidden=false;$("#lgMsg").textContent=SB?"":"El login todavía no está configurado: falta completar config.js.";
  $("#lgMail").focus();
}
function loginHandlers(){
  $("#lgClose").onclick=()=>{$("#login").hidden=true};
  $("#login").onclick=e=>{if(e.target.id==="login")$("#login").hidden=true};
  document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#login").hidden=true});
  $("#lgGoogle").onclick=async()=>{
    if(!SB)return;
    const {error}=await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
    if(error)$("#lgMsg").textContent="No se pudo abrir Google: "+error.message;
  };
  $("#lgForm").onsubmit=async e=>{
    e.preventDefault();if(!SB)return;
    const email=$("#lgMail").value.trim();$("#lgMsg").textContent="Enviando…";
    const {error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
    $("#lgMsg").textContent=error?"No se pudo enviar: "+error.message:"Listo. Revisá tu mail (y spam) y tocá el link para entrar.";

let rankTab="global",rankDocs=[],rankTimer=null;
async function subRanking(){clearInterval(rankTimer);await cargarRanking();rankTimer=setInterval(()=>{if($("#rankList"))cargarRanking()},60000)}
async function cargarRanking(){
  if(!SB){rankDocs=null;return paintRanking()}
  let q=SB.from("legados").select("user_id,nombre,puntos,titulo,pais,diario_puntos,diario_titulo,diario_pais");
  q=rankTab==="global"?q.order("puntos",{ascending:false}).limit(10):q.eq("diario_fecha",hoyISO()).order("diario_puntos",{ascending:false}).limit(10);
  const {data,error}=await q;rankDocs=error?[]:(data||[]);paintRanking();
}
function paintRanking(){
  const box=$("#rankList");if(!box)return;
  if(rankDocs===null){box.innerHTML='<div class="empty">El ranking se activa cuando el sitio tenga la base de datos configurada.</div>';return}
  if(!rankDocs.length){box.innerHTML='<div class="empty">'+(rankTab==="global"?"Todavía no hay legados. Ingresá, terminá una partida y estrenalo.":"Nadie jugó el desafío de hoy. Podés ser el primero.")+'</div>';return}
  const ol=document.createElement("ol");ol.className="rank";
  rankDocs.forEach((d,i)=>{
    const g=rankTab==="global",li=document.createElement("li");
    li.innerHTML='<span class="pos">'+String(i+1).padStart(2,"0")+'</span><span class="nm"><b></b><span></span></span><span class="pts"></span>';
    li.querySelector("b").textContent=d.nombre||"Jugador";
    li.querySelector(".nm span").textContent=((g?d.titulo:d.diario_titulo)||"")+" · "+(PAISES[g?d.pais:d.diario_pais]?.n||"");
    li.querySelector(".pts").textContent=Number((g?d.puntos:d.diario_puntos)||0).toLocaleString("es-AR");
    if(SESSION&&d.user_id===SESSION.user.id)li.style.fontWeight="600";
    ol.appendChild(li);
  });
  box.innerHTML="";box.appendChild(ol);
}

  const h=hash("mandato"+hoyISO()),pk=Object.keys(PAISES),ok=Object.keys(ORIGENES),rs=Object.keys(RASGOS),io=Object.keys(IDEOS);
  const r1=rs[h%rs.length],r2=rs[(h>>>5)%rs.length]===r1?rs[((h>>>5)+1)%rs.length]:rs[(h>>>5)%rs.length];

/* ================== MOTOR ================== */
function nueva(o){
  G={pais:o.pais,ideo:o.ideo,origen:o.origen,rasgos:o.rasgos,nombre:(o.nombre||"").trim()||nombreUsuario()||"Sin nombre",diario:!!o.diario,yaJugado:!!o.yaJugado,
     rs:o.seed??Math.floor(Math.random()*2**31),anio:2027,edad:26,st:{l:45,i:45,p:45,n:50,e:50,s:5},
     cargo:null,ultTier:1,aniosCargo:0,mandatoAnios:0,mandatos:0,hist:[],maxTier:0,ramas:[],usados:[],puntos:0,
     elecG:0,elecP:0,maxEsc:0,exTop:false,fase:"evento",cola:[],ev:0,vista:"game",log:[]};
  const add=ef=>{for(const k in ef)G.st[k]=clamp(G.st[k]+ef[k],0,100)};
  add(ORIGENES[G.origen].ef);add(IDEOS[G.ideo].ef);
  const rs=rangos(G.pais);let start;
  if(o.modo==="escenario"){
    const e=ESCENARIOS.find(x=>x.id===o.esc);add(e.ef);G.edad=e.edad;
    const br=rs.filter(r=>r.rama===e.rama);
    start=e.ordenTop?br.find(r=>r.top):e.ordenLast?br[br.length-1]:br[e.orden];
    G.escenario=e.n;
  }else if(o.modo==="directo"){start=rs.find(r=>r.id===o.inicio);G.edad=start.tier>=7?54:start.tier>=5?48:42}
  else start=rs.find(r=>r.id===(G.origen==="diplomatico"?"diplomacia0":"politica0"));
  setCargo(start,true);
  nuevoAnio();save();show("game");
}
function setCargo(r,inicial){
  const mismo=G.cargo===r.id;
  G.cargo=r.id;G.aniosCargo=0;G.mandatoAnios=0;G.mandatos=mismo?G.mandatos+1:1;
  if(!mismo)G.hist.push({anio:G.anio,cargo:r.nombre,tier:r.tier});
  G.maxTier=Math.max(G.maxTier,r.tier);if(!G.ramas.includes(r.rama))G.ramas.push(r.rama);
  if(r.top&&!mismo)G.llegoTop=true;
}
function sinCargo(motivo){const r=rk(G.cargo);G.ultTier=r?r.tier:G.ultTier;if(r?.top)G.exTop=true;G.cargo=null;G.aniosCargo=0;G.hist.push({anio:G.anio,cargo:"Sin cargo"+(motivo?" · "+motivo:""),tier:0})}
function tags(){
  const r=rk(G.cargo);if(!r)return["g","fuera"];
  const t=["g"];if(r.rama==="politica")t.push("leg");if(r.rama==="ejecutivo")t.push("eje");if(r.top)t.push("top");if(r.rama==="diplomacia"||r.rama==="internacional")t.push("dip");
  return t;
}
function nuevoAnio(){
  const tg=tags();let pool=EV.map((e,i)=>i).filter(i=>tg.includes(EV[i].t)&&!G.usados.includes(i));
  if(pool.length<2){G.usados=G.usados.filter(i=>!tg.includes(EV[i].t));pool=EV.map((e,i)=>i).filter(i=>tg.includes(EV[i].t))}
  // prioriza eventos propios del cargo
  const prop=pool.filter(i=>EV[i].t!=="g");
  const a=prop.length&&R()<.7?pick(prop):pick(pool);
  const b=pick(pool.filter(i=>i!==a));
  G.cola=[a,b];G.usados.push(a,b);G.ev=0;G.fase="evento";
}
function aplicar(ef){
  const out={};
  for(const k in ef){
    let v=ef[k];
    if(v>0){
      if(k==="l"&&G.rasgos.includes("carismatico"))v*=1.3;
      if(k==="e"&&G.rasgos.includes("tecnico"))v*=1.3;
      if(k==="i"&&G.rasgos.includes("poliglota"))v*=1.3;
      if((k==="p"||k==="n")&&G.rasgos.includes("negociador"))v+=2;
      if(k==="l"&&G.rasgos.includes("populista"))v+=2;
      if(k==="s"&&G.rasgos.includes("prolijo"))v*=.5;
    }else if(v<0){ if(k==="i"&&G.rasgos.includes("populista"))v*=1.3 }
    v=Math.round(v);const old=G.st[k];G.st[k]=clamp(old+v,0,100);out[k]=G.st[k]-old;
  }
  G.maxEsc=Math.max(G.maxEsc,G.st.s);
  return out;
}
function elegir(i){
  const e=EV[G.cola[G.ev]],op=e.o[i];
  const d=aplicar(op[1]);
  G.ult={res:op[2],d,elec:op[0]};G.fase="resultado";G.log.push({anio:G.anio,tit:e.tit,op:op[0]});
  save();vGame();
}
function seguir(){
  if(G.ev===0){G.ev=1;G.fase="evento";save();vGame();return}
  finAnio();
}
function finAnio(){
  const r=rk(G.cargo);
  // deriva natural
  G.st.s=clamp(G.st.s-3,0,100);
  if(r&&(r.rama==="ejecutivo"))G.st.e=clamp(G.st.e+Math.round((R()-.5)*8),0,100);
  G.puntos+=r?r.tier*12:3;G.aniosCargo++;G.mandatoAnios++;G.anio++;G.edad++;
  if(G.st.s>=100)return fin("Procesado por la Justicia. Tu carrera termina en tribunales.");
  if(r?.top&&G.st.l<=6)return fin("Juicio político. "+PAISES[G.pais].cong[0].toUpperCase()+PAISES[G.pais].cong.slice(1)+" te remueve del cargo.");
  if(G.edad>=80)return fin("Te retirás por edad, con el traje colgado y muchas historias.");
  if(r&&r.via==="nombramiento"&&(G.st.p<18||G.st.n<12)&&R()<.7){sinCargo("renuncia");G.aviso="Te pidieron la renuncia. Perdiste el apoyo para seguir en el cargo.";G.ofertas=ofertas(true);G.fase="ofertas";save();vGame();return}
  const term=r?(r.top?PAISES[G.pais].top.term:4):0;
  if(r&&r.via==="eleccion"&&G.mandatoAnios>=term){
    if(r.top&&G.mandatos>=PAISES[G.pais].top.max)G.exTop=true;
    G.fase="mandato";G.ofertas=ofertas(G.exTop,true);save();vGame();return;
  }
  if(!r||(r.via==="nombramiento"&&G.aniosCargo>=2)){
    const of=ofertas(!r);
    if(of.length){G.ofertas=of;G.fase="ofertas";save();vGame();return}
  }
  nuevoAnio();save();vGame();
}
function chance(r){
  const s=G.st;
  if(r.via==="eleccion")return .22+(s.l+s.p-100)/180;
  if(r.rama==="diplomacia"||r.rama==="internacional")return .22+(s.i+s.p*.5+s.n*.5-100)/180;
  return .22+(s.p+s.n-100)/180;
}
function ofertas(forzar,finMandato){
  const all=rangos(G.pais),cur=rk(G.cargo),t=cur?cur.tier:G.ultTier,TP=PAISES[G.pais].top;
  const c=[];
  for(const r of all){
    if(cur&&r.id===cur.id)continue;
    let ok=false,bonus=0;
    if(cur&&r.rama===cur.rama&&r.orden===cur.orden+1){ok=true;bonus=.25}
    else if(r.top){ok=t>=5&&!G.exTop}
    else if(r.rama==="internacional"){ok=!cur?.top&&t>=4&&(r.tier<=t+1||G.exTop)&&(["diplomacia","ejecutivo","internacional"].includes(cur?.rama)||G.st.i>=62||G.exTop)}
    else if(r.rama==="diplomacia"&&r.tier<=3&&cur?.rama!=="diplomacia"){ok=false}
    else if(G.exTop){ok=r.tier>=4}
    else if(!cur){ok=r.tier>=Math.max(1,t-1)&&r.tier<=t}
    else ok=r.rama!==cur.rama&&(r.tier===t||r.tier===t+1);
    if(!ok)continue;
    if(r.top&&(G.st.p<58||G.st.l<50)){G.pista="Para ser candidato a "+r.nombre+" necesitás más apoyo del partido (58+) e imagen local (50+).";continue}
    c.push({r,p:clamp(chance(r)+bonus,.05,.95)});
  }
  let of=c.filter(x=>R()<x.p);
  if(!of.length&&forzar&&c.length)of=[c.sort((a,b)=>b.p-a.p)[0]];
  of.sort((a,b)=>(b.r.top?1:0)-(a.r.top?1:0)||b.r.tier-a.r.tier);
  return of.slice(0,3).map(x=>({id:x.r.id,p:x.p}));
}

/* Elecciones */
function eleccion(r,reel){
  const s=G.st,P=PAISES[G.pais];
  let base=.5*s.l+.25*s.p+.25*((reel&&r.top)?s.e:s.n);
  if(reel)base+=r.top?(s.e-50)*.15:3;
  if(G.rasgos.includes("carismatico"))base+=3;
  let pct=clamp(Math.round((base*.5+23+(R()-.5)*20)*10)/10,12,72);
  let gano,txt;
  if(r.top){
    const m=P.top.modo;
    if(m==="balotaje"){
      if(pct>=45||(pct>=40&&R()<.5)){gano=true;txt=`Ganás en primera vuelta con el ${pct}% de los votos.`}
      else{const p2=clamp(Math.round((pct+12+(R()-.45)*14+(s.l-50)*.15)*10)/10,30,70);gano=p2>=50;txt=`Primera vuelta: ${pct}%. Balotaje: ${p2}% contra ${Math.round((100-p2)*10)/10}%. `+(gano?"Ganás la segunda vuelta.":"Perdés en la segunda vuelta.");pct=p2}
    }else if(m==="colegio"){
      const ev=clamp(Math.round(270+(pct-48)*22+(R()-.5)*60),60,480);gano=ev>=270;txt=`${pct}% del voto popular y ${ev} electores del Colegio Electoral (se necesitan 270).`;
    }else if(m==="escanios"){
      const tot=P.top.esc,maj=Math.floor(tot/2)+1,seats=clamp(Math.round(tot*(pct/100)*1.18),20,tot-20);
      if(seats>=maj){gano=true;txt=`Tu partido saca ${seats} de ${tot} bancas: mayoría absoluta.`}
      else if(seats>=tot*.4&&R()<.35+(s.n-50)/100+(s.p-50)/200){gano=true;txt=`Sacás ${seats} de ${tot} bancas. Sin mayoría, armás una coalición y te invisten.`}
      else{gano=false;txt=`Sacás ${seats} de ${tot} bancas. La oposición arma gobierno.`}
    }else{const riv=Math.round((30+R()*16)*10)/10;gano=pct>riv;txt=`Sacás ${pct}% contra ${riv}% de tu rival más cercano.`}
  }else{
    const riv=Math.round((36+R()*16)*10)/10;gano=pct>riv;txt=`Sacás ${pct}% contra ${riv}% de la principal lista rival.`;
  }
  if(gano)G.elecG++;else G.elecP++;
  return{gano,txt,pct};
}

function aceptar(id,reel){
  const r=rk(id)||rangos(G.pais).find(x=>x.id===id);
  G.pista=null;G.aviso=null;G.fase_prev=G.fase;
  if(r.via==="eleccion"){
    const res=eleccion(r,reel);
    G.elec={...res,cargo:r.nombre,id:r.id,reel};G.fase="eleccion";
    if(res.gano){setCargo(r)}
    else{ if(G.cargo===r.id||reel||G.fase_prev==="mandato"){sinCargo("derrota")} }
  }else{
    setCargo(r);G.aviso=`Te nombran ${r.nombre}.`;nuevoAnio();
  }
  save();vGame();
}
function rechazar(){G.pista=null;G.aviso=null;nuevoAnio();save();vGame()}
function contEleccion(){G.elec=null;nuevoAnio();save();vGame()}

function fin(motivo){
  G.fin=motivo;G.vista="legado";
  const s=G.st;
  const logros=[];
  if(G.elecG>=3)logros.push(`Ganó ${G.elecG} elecciones`);
  if(G.hist.filter(h=>h.tier===7).length&&G.llegoTop)logros.push("Llegó a la cima");
  if(G.ramas.length>=3)logros.push("Pasó por "+G.ramas.length+" ramas");
  if(G.ramas.includes("internacional"))logros.push("Pisó la ONU");
  if(G.maxEsc>=60&&s.s<40&&!motivo.startsWith("Procesado"))logros.push("Sobrevivió a un escándalo");
  if(G.elecP===0&&G.elecG>0)logros.push("Invicto en las urnas");
  const finales=Math.round((s.l+s.i+s.n+s.e+s.p)/2-s.s);
  G.puntosFinal=Math.max(0,G.puntos+finales+logros.length*60+(G.maxTier>=7?250:0)-(motivo.startsWith("Procesado")?200:0));
  G.logros=logros;G.titulo=titulo();
  clearSave();try{localStorage.setItem("elmandato.ultimo",JSON.stringify(G))}catch(e){}
  if(G.diario&&!G.yaJugado){try{localStorage.setItem("elmandato.diario",hoyISO())}catch(e){}}
  guardarRanking();
  show("legado");
}
function titulo(){
  const s=G.st,top=G.maxTier>=7&&G.llegoTop;
  if(G.fin.startsWith("Procesado")||s.s>=80)return"Prontuario Abierto";
  if(G.ramas.includes("internacional")&&G.hist.some(h=>h.cargo==="Secretario General de la ONU"))return"Voz del Mundo";
  if(top&&s.i>=68)return"Estadista Global";
  if(top&&s.e>=68)return"Arquitecto de la Estabilidad";
  if(top&&s.l>=68)return"Ídolo Popular";
  if(top&&s.n>=68)return"Republicano de Ley";
  if(top)return"El que llegó";
  if(G.ramas.includes("internacional"))return"Diplomático Global";
  if(G.ramas.includes("diplomacia")&&G.maxTier>=5)return"Canciller de Hierro";
  if(G.maxTier>=5&&s.l>=65)return"Caudillo Territorial";
  if(s.p>=75)return"Soldado del Partido";
  if(s.n>=72)return"Hombre de las Instituciones";
  if(G.maxTier<=2)return"Militante de Base";
  return"Animal Político";
}
async function guardarRanking(){
  if(!SB||!SESSION)return;
  const msg=t=>{const el=$("#rkState");if(el)el.textContent=t};
  try{
    const uid=SESSION.user.id;
    const {data:cur,error:e1}=await SB.from("legados").select("*").eq("user_id",uid).maybeSingle();
    if(e1)throw e1;
    const d=cur?{...cur}:{user_id:uid,puntos:0};
    let ch=!cur;
    if(G.puntosFinal>(d.puntos||0)){
      const mejor=G.hist.filter(h=>h.tier).sort((a,b)=>b.tier-a.tier)[0];
      Object.assign(d,{nombre:String(G.nombre||"Jugador").slice(0,40),puntos:G.puntosFinal,titulo:G.titulo,pais:G.pais,cargo:mejor?.cargo||"",fecha:hoyISO()});ch=true;
    }
    if(G.diario&&!G.yaJugado&&d.diario_fecha!==hoyISO()){
      Object.assign(d,{diario_fecha:hoyISO(),diario_puntos:G.puntosFinal,diario_titulo:G.titulo,diario_pais:G.pais});
      if(!d.nombre)d.nombre=String(G.nombre||"Jugador").slice(0,40);ch=true;
    }
    if(ch){d.updated_at=new Date().toISOString();const {error}=await SB.from("legados").upsert(d);if(error)throw error}
    G.guardado=true;msg(ch?"Guardado en el ranking.":"Tu mejor legado sigue siendo uno anterior.");
  }catch(e){msg("No se pudo guardar en el ranking. Probá de nuevo más tarde.")}
}

/* ================== VISTA DE JUEGO ================== */
function colorFor(k,v){const good=k==="s"?100-v:v;return good>=60?"var(--good)":good>=35?"var(--warn)":"var(--bad)"}
function legajo(){
  const r=rk(G.cargo),P=PAISES[G.pais];
  return `<aside class="legajo">
   <div><span class="eyebrow">Legajo · ${P.c}${G.diario?" · Desafío diario":G.escenario?" · "+esc(G.escenario):""}</span><h3>${esc(G.nombre)}</h3></div>
   <div class="cargo">${r?esc(r.nombre):"Sin cargo"}</div>
   <div class="meta"><span class="tag">${G.anio}</span><span class="tag">${G.edad} años</span><span class="tag">${IDEOS[G.ideo].n}</span>${G.rasgos.map(x=>`<span class="tag">${RASGOS[x].n}</span>`).join("")}</div>
   <div class="stats">${Object.keys(ST).map(k=>`<div class="stat"><span>${ST[k]}</span><span class="bar"><i style="width:${G.st[k]}%;background:${colorFor(k,G.st[k])}"></i></span><span class="v">${G.st[k]}</span></div>`).join("")}</div>
   <div><span class="eyebrow">Trayectoria</span><ul class="tray" style="margin-top:6px">${G.hist.map(h=>`<li><span class="y">${h.anio}</span>${esc(h.cargo)}</li>`).join("")}</ul></div>
   <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ghost" id="bRetiro">Retirarme</button><button class="btn sm ghost" id="bSalir">Guardar y salir</button></div>
  </aside>`;
}
function deltas(d){return `<div class="deltas">${Object.keys(d).filter(k=>d[k]!==0).map(k=>{const up=k==="s"?d[k]<0:d[k]>0;return`<span class="d ${up?"up":"down"}">${ST[k]} ${d[k]>0?"+":""}${d[k]}</span>`}).join("")||'<span class="d">Sin cambios</span>'}</div>`}
function vGame(){
  if(!G)return show("home");
  const P=PAISES[G.pais],r=rk(G.cargo),nro=String(1000+(G.anio-2027)*2+G.ev).padStart(4,"0");
  let body="",head=`<span>CABLE N° ${nro} · ${P.c}</span><span>${G.anio} · ${r?esc(r.nombre).toUpperCase():"SIN CARGO"}</span>`;
  if(G.fase==="evento"){
    const e=EV[G.cola[G.ev]];
    body=`${G.aviso?`<p class="res">${esc(G.aviso)}</p>`:""}<span class="stamp">Suceso ${G.ev+1} de 2 · ${G.anio}</span><h2>${esc(tpl(e.tit))}</h2><p class="txt">${esc(tpl(e.txt))}</p>
    <div class="choices">${e.o.map((o,i)=>`<button class="choice" data-c="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(tpl(o[0]))}</span></button>`).join("")}</div>`;
  }else if(G.fase==="resultado"){
    body=`<span class="stamp">Decisión tomada</span><h2>${esc(tpl(G.ult.elec))}</h2><p class="res">${esc(G.ult.res)}</p>${deltas(G.ult.d)}
    <div class="gbar"><span class="muted">${G.ev===0?"Queda un suceso este año.":"Cierra el año "+G.anio+"."}</span><button class="btn primary" id="bNext">${G.ev===0?"Siguiente cable":"Cerrar el año"}</button></div>`;
  }else if(G.fase==="ofertas"||G.fase==="mandato"){
    const fm=G.fase==="mandato",TP=P.top,puedeReel=fm&&r&&(!r.top||G.mandatos<TP.max);
    body=`${G.aviso?`<p class="res">${esc(G.aviso)}</p>`:""}<span class="stamp">${fm?"Fin de mandato":"Propuestas sobre la mesa"}</span>
    <h2>${fm?(puedeReel?"¿Vas por otro mandato?":"Terminó tu mandato"):"Te ofrecen un cambio"}</h2>
    <p class="txt">${fm?(puedeReel?`Cumpliste ${G.mandatos} mandato${G.mandatos>1?"s":""} como ${esc(r.nombre)}. Podés buscar la reelección o ir por otra cosa.`:`La ley no te permite otro mandato como ${esc(r.nombre)}. ¿Qué sigue?`):(r?`Llevás ${G.aniosCargo} años como ${esc(r.nombre)}. Estas son las propuestas de este año.`:"Estás en el llano. Estas son las puertas que se abren.")}</p>
    <div class="choices">
     ${puedeReel?`<div class="offer"><div><b>Reelección · ${esc(r.nombre)}</b><span>Elección · se juzga tu gestión</span></div><button class="btn primary sm" data-reel="${r.id}">Ir a elecciones</button></div>`:""}
     ${(G.ofertas||[]).map(o=>{const x=rk(o.id)||rangos(G.pais).find(y=>y.id===o.id);return`<div class="offer"><div><b>${esc(x.nombre)}</b><span>${RAMAS[x.rama]} · ${x.via==="eleccion"?"Elección · chances "+(o.p>.6?"altas":o.p>.35?"medias":"bajas"):"Nombramiento directo"}</span></div><button class="btn sm ${x.top?"primary":""}" data-of="${x.id}">${x.via==="eleccion"?"Ser candidato":"Aceptar"}</button></div>`}).join("")}
     ${!fm&&r?`<div class="offer"><div><b>Seguir como ${esc(r.nombre)}</b><span>Rechazás las propuestas por ahora</span></div><button class="btn sm ghost" id="bQuedo">Quedarme</button></div>`:""}
     ${fm&&!puedeReel&&!(G.ofertas||[]).length?`<div class="offer"><div><b>Volver al llano</b><span>Un tiempo afuera, con chances de volver</span></div><button class="btn sm ghost" id="bLlano">Aceptar</button></div>`:""}
     ${fm&&puedeReel?`<div class="offer"><div><b>No me presento</b><span>Te vas al llano</span></div><button class="btn sm ghost" id="bLlano">Aceptar</button></div>`:""}
     ${!r&&!(G.ofertas||[]).length?`<div class="offer"><div><b>Seguir en el llano</b><span>Un año más armando tu regreso</span></div><button class="btn sm ghost" id="bQuedo">Seguir</button></div>`:""}
    </div>${G.pista?`<p class="muted" style="margin:0;font-size:13px">${esc(G.pista)}</p>`:""}`;
  }else if(G.fase==="eleccion"){
    const e=G.elec;
    body=`<span class="stamp">${e.gano?"Ganaste":"Perdiste"} · elección ${G.anio}</span><h2>${esc(e.cargo)}</h2>
    <div class="vote" style="color:${e.gano?"var(--good)":"var(--bad)"}">${e.pct}%</div><p class="txt">${esc(e.txt)}</p>
    <div class="gbar"><span class="muted">${e.gano?"Asumís el cargo.":"Te toca reagruparte."}</span><button class="btn primary" id="bElec">Continuar</button></div>`;
  }
  app.innerHTML=`<div class="game">${legajo()}<div class="col" style="gap:16px"><section class="cable"><div class="cable-h">${head}</div><div class="cable-b">${body}</div></section>${adHTML("game","inline","Banner adaptable")}</div></div>`;
  pushAds();
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{G.aviso=null;elegir(+b.dataset.c)});
  if($("#bNext"))$("#bNext").onclick=seguir;
  app.querySelectorAll("[data-of]").forEach(b=>b.onclick=()=>aceptar(b.dataset.of,false));
  app.querySelectorAll("[data-reel]").forEach(b=>b.onclick=()=>aceptar(b.dataset.reel,true));
  if($("#bQuedo"))$("#bQuedo").onclick=rechazar;
  if($("#bLlano"))$("#bLlano").onclick=()=>{sinCargo("fin de mandato");rechazar()};
  if($("#bElec"))$("#bElec").onclick=contEleccion;
  $("#bRetiro").onclick=()=>{const b=$("#bRetiro");if(b.dataset.ok){fin("Te retirás de la política por decisión propia.")}else{b.dataset.ok=1;b.textContent="¿Seguro? Tocá de nuevo";b.classList.remove("ghost")}};
  $("#bSalir").onclick=()=>{save();G=null;show("home")};
}

/* ================== LEGADO ================== */
function vLegado(){
  if(!G||!G.fin){const u=(()=>{try{return JSON.parse(localStorage.getItem("elmandato.ultimo"))}catch(e){return null}})();if(!u)return show("home");G=u}
  const P=PAISES[G.pais],s=G.st;
  const sq=v=>{const n=Math.round(v/20);return"🟩".repeat(n)+"⬜".repeat(5-n)};
  const tray=G.hist.filter(h=>h.tier>0).map(h=>h.cargo);
  const share=`EL MANDATO · ${P.n}${G.diario?" · Desafío "+hoyISO():""}
${G.titulo} · ${G.puntosFinal} pts
${tray.slice(-4).join(" → ")}
Local ${sq(s.l)}
Mundo ${sq(s.i)}
Instit ${sq(s.n)}
Econ  ${sq(s.e)}`;
  app.innerHTML=`<div class="legacy">
   <section class="lcard">
    <span class="eyebrow">Legado · ${esc(G.nombre)} · ${P.n} · ${G.hist[0].anio}–${G.anio}</span>
    <div class="ltitle">${esc(G.titulo)}</div>
    <div class="lpts">${G.puntosFinal.toLocaleString("es-AR")} puntos · cargo máximo nivel ${G.maxTier} · ${G.elecG} elecciones ganadas, ${G.elecP} perdidas</div>
    <p class="res">${esc(G.fin)}</p>
    ${G.logros.length?`<div class="logros">${G.logros.map(l=>`<span class="tag">${esc(l)}</span>`).join("")}</div>`:""}
    <div><span class="eyebrow">Línea de tiempo</span><div class="timeline" style="margin-top:6px">${G.hist.map(h=>`<div><span>${h.anio}</span><b style="font-weight:${h.tier>=5?600:400}">${esc(h.cargo)}</b></div>`).join("")}</div></div>
    <div class="stats">${Object.keys(ST).map(k=>`<div class="stat"><span>${ST[k]}</span><span class="bar"><i style="width:${s[k]}%;background:${colorFor(k,s[k])}"></i></span><span class="v">${s[k]}</span></div>`).join("")}</div>
   </section>
   <aside class="col">
    ${adHTML("end","box","300 × 250")}
    <section class="lcard" style="padding:16px;gap:10px">
     <span class="eyebrow">Compartí tu legado</span>
     <textarea class="share" id="shareTxt" readonly>${esc(share)}</textarea>
     <button class="btn primary" id="bCopy">Copiar resultado</button>
     <span class="muted" style="font-size:12.5px" id="rkState">${SESSION?(G.guardado?"Guardado en el ranking.":"Guardando en el ranking…"):"Jugaste como invitado: este legado no entra al ranking. Ingresá antes de tu próxima partida."}</span>
     ${G.diario&&G.yaJugado?'<span class="muted" style="font-size:12.5px">Ya habías jugado el desafío de hoy: esta partida no cuenta para el ranking diario.</span>':""}
    </section>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bOtra">Otra carrera</button><button class="btn ghost" id="bInicio">Inicio</button></div>
   </aside>
  </div>`;
  $("#bCopy").onclick=()=>{const t=$("#shareTxt");const ok=()=>{$("#bCopy").textContent="Copiado"};try{navigator.clipboard.writeText(share).then(ok,()=>{t.select();$("#bCopy").textContent="Seleccionado: copialo"})}catch(e){t.select()}};
  $("#bOtra").onclick=()=>{G=null;show("setup")};
  $("#bInicio").onclick=()=>{G=null;show("home")};
}

$("#goHome").onclick=()=>{if(G&&!G.fin)save();G=null;show("home")};
$("#fecha").textContent=new Date().toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"});
$("#adTop").innerHTML=adHTML("top","leader","728 × 90");
loadAdsense();
loginHandlers();
renderWho();
show("home");
initAuth();
